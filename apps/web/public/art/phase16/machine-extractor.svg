<svg xmlns="http://www.w3.org/2000/svg" width="96" height="88" viewBox="0 0 96 88">
<title>Surface extractor — industrial diesel drilling rig, three-quarter view</title>
<defs>
  <linearGradient id="steelTop" x1="0" y1="0" x2=".3" y2="1">
    <stop stop-color="#9ca39a"/><stop offset=".5" stop-color="#69766a"/><stop offset="1" stop-color="#465348"/>
  </linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#687269"/><stop offset="1" stop-color="#303a35"/>
  </linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="1" y2=".7">
    <stop stop-color="#4e6056"/><stop offset="1" stop-color="#1f2b28"/>
  </linearGradient>
  <linearGradient id="mast" x1="0" y1="0" x2="1" y2=".5">
    <stop stop-color="#d5c5a2"/><stop offset=".33" stop-color="#68736a"/><stop offset="1" stop-color="#2b3530"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#eed6a3"/><stop offset=".55" stop-color="#b78f52"/><stop offset="1" stop-color="#6f5837"/>
  </linearGradient>
</defs>
<!-- Compact orthographic industrial silhouette, transparent outside the machine. -->
<ellipse cx="49" cy="76" rx="39" ry="9" fill="#101817" opacity=".44"/>
