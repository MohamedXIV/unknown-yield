<path d="M43 61 82 50 82 70 43 80Z" fill="url(#front)" stroke="#a8a58a" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M17 52 41 62 41 75 17 65Z" fill="none" stroke="#182624" stroke-width="1.6"/>
