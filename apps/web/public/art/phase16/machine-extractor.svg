<g fill="#e3d4aa" stroke="#313e34" stroke-width=".55">
<circle cx="18" cy="52" r="1.1"/><circle cx="39" cy="61" r="1"/><circle cx="17" cy="66" r="1"/><circle cx="39" cy="75" r="1"/><circle cx="47" cy="76" r="1"/><circle cx="78" cy="67" r="1"/>
</g>
<!-- Painted service chevrons are not an operational state indicator. -->
<path d="m62 71 3-.8 2-3 3-.8 2-3" fill="none" stroke="#bd944f" stroke-width="1.6" opacity=".9"/>
</svg>